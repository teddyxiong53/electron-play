<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="avatar">👤</div>
            <div class="nav-items">
                <a href="#" class="active">💬</a>
                <a href="#">👥</a>
                <a href="#">⭐</a>
                <a href="#">🌐</a>
                <a href="#">📁</a>
            </div>
        </nav>

        <!-- 中间会话列表 -->
        <div class="chat-list">
            <div class="search-bar">
                <input type="text" placeholder="搜索">
            </div>
            <div class="chat-items">
                <div class="chat-item active">
                    <div class="chat-avatar">🎯</div>
                    <div class="chat-info">
                        <div class="chat-name">技术交流群A</div>
                        <div class="chat-message">用户1：新版本的功能很棒</div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-time">14:45</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="chat-avatar">💻</div>
                    <div class="chat-info">
                        <div class="chat-name">开源项目讨论组</div>
                        <div class="chat-message">用户2：界面优化得不错</div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-time">14:26</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="chat-avatar">🔧</div>
                    <div class="chat-info">
                        <div class="chat-name">工具开发群</div>
                        <div class="chat-message">用户3：测试结果很稳定</div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-time">14:08</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧聊天窗口 -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-title">
                    <h2>技术交流群A</h2>
                    <div class="chat-subtitle">3条新消息</div>
                </div>
                <div class="chat-actions">
                    <button>📞</button>
                    <button>🎥</button>
                    <button>💻</button>
                    <button>⚙️</button>
                </div>
            </div>
            <div class="chat-messages">
                <div class="message">
                    <div class="message-avatar">👤</div>
                    <div class="message-content">
                        <div class="message-author">用户1</div>
                        <div class="message-text">新版本的功能很棒</div>
                    </div>
                </div>
                <div class="message">
                    <div class="message-avatar">👤</div>
                    <div class="message-content">
                        <div class="message-author">用户2</div>
                        <div class="message-text">确实，使用体验提升很多</div>
                    </div>
                </div>
            </div>
            <div class="chat-input">
                <div class="input-toolbar">
                    <button>😊</button>
                    <button>✂️</button>
                    <button>📄</button>
                    <button>🖼️</button>
                    <button>📧</button>
                    <button>🎤</button>
                </div>
                <div class="input-box" contenteditable="true"></div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
