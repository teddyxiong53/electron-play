<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Hello Electron!</h1>
    <script>
        // 调用预加载脚本暴露的API
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('h1').textContent += ` (Running on ${window.electronAPI.getPlatform()})`
        })
    </script>
</body>
</html>
