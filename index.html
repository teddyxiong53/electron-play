<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .sidebar {
            width: 240px;
            background-color: white;
            border-right: 1px solid #eee;
        }
        .main-content {
            flex: 1;
            background-color: white;
        }
        .album-card {
            transition: transform 0.2s;
        }
        .album-card:hover {
            transform: scale(1.05);
        }
        .player-controls {
            background-color: white;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body class="h-screen flex">
    <!-- 左侧边栏 -->
    <div class="sidebar h-full p-6 flex flex-col">
        <div class="flex items-center mb-8">
            <img src="https://placehold.co/40" alt="用户头像" class="rounded-full mr-3">
            <div>
                <h3 class="font-semibold">Farzan Faruk</h3>
                <p class="text-sm text-gray-500">Lookstudio@gmail.com</p>
            </div>
        </div>
        
        <nav class="space-y-4">
            <a href="#" class="flex items-center text-blue-600">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                </svg>
                Home
            </a>
            <a href="#" class="flex items-center text-gray-600">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V4zM8 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zM15 3a1 1 0 00-1 1v12a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2z"/>
                </svg>
                Browse
            </a>
            <a href="#" class="flex items-center text-gray-600">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"/>
                </svg>
                Album
            </a>
            <a href="#" class="flex items-center text-gray-600">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                </svg>
                Artists
            </a>
            <a href="#" class="flex items-center text-gray-600">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
                </svg>
                Videos
            </a>
        </nav>

        <div class="mt-8">
            <h4 class="text-sm font-semibold text-gray-500 mb-4">MY MUSIC</h4>
            <nav class="space-y-4">
                <a href="#" class="flex items-center text-gray-600">
                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                    Recently Played
                </a>
                <a href="#" class="flex items-center text-gray-600">
                    <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 0h8v12H6V4z" clip-rule="evenodd"/>
                    </svg>
                    Local Files
                </a>
            </nav>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold">Billboard Topchart</h2>
            <div class="flex items-center">
                <div class="relative mr-4">
                    <input type="text" placehold="Search for song, artists etc." class="w-64 px-4 py-2 rounded-full bg-gray-100 focus:outline-none">
                    <svg class="w-5 h-5 text-gray-500 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <button class="px-4 py-2 bg-red-500 text-white rounded-full text-sm">Upgrade PRO</button>
            </div>
        </div>

        <!-- 专辑展示区 -->
        <div class="grid grid-cols-5 gap-6 mb-8">
            <div class="album-card rounded-lg overflow-hidden shadow-lg">
                <img src="https://placehold.co/200x200" alt="专辑封面" class="w-full">
                <div class="p-4">
                    <h3 class="font-semibold">Coloring Book</h3>
                    <p class="text-sm text-gray-500">Pop King</p>
                </div>
            </div>
            <!-- 其他专辑卡片 -->
        </div>

        <!-- 播放列表 -->
        <div class="bg-white rounded-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold">Most Popular</h3>
                <span class="text-sm text-gray-500">98 songs on the list</span>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                    <div class="flex items-center">
                        <span class="text-gray-500 mr-4">01</span>
                        <img src="https://placehold.co/40" alt="歌曲封面" class="w-10 h-10 rounded mr-4">
                        <div>
                            <h4 class="font-semibold">My Stress</h4>
                            <p class="text-sm text-gray-500">NF Real music</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <span class="text-gray-500 mr-4">3:22</span>
                        <button class="text-red-500">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- 其他歌曲项 -->
            </div>
        </div>
    </div>

    <!-- 播放控制栏 -->
    <div class="player-controls fixed bottom-0 left-0 right-0 h-20 px-6 flex items-center justify-between">
        <div class="flex items-center">
            <img src="https://placehold.co/50" alt="当前播放歌曲封面" class="w-12 h-12 rounded mr-4">
            <div>
                <h4 class="font-semibold">Chance The Rapper</h4>
                <p class="text-sm text-gray-500">Pop King</p>
            </div>
        </div>

        <div class="flex items-center space-x-6">
            <button class="text-gray-600">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M8.445 14.832A1 1 0 0010 14v-2.798l5.445 3.63A1 1 0 0017 14V6a1 1 0 00-1.555-.832L10 8.798V6a1 1 0 00-1.555-.832l-6 4a1 1 0 000 1.664l6 4z"/>
                </svg>
            </button>
            <button class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                </svg>
            </button>
            <button class="text-gray-600">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4.555 5.168A1 1 0 003 6v8a1 1 0 001.555.832L10 11.202V14a1 1 0 001.555.832l6-4a1 1 0 000-1.664l-6-4A1 1 0 0010 6v2.798L4.555 5.168z"/>
                </svg>
            </button>
        </div>

        <div class="flex items-center">
            <button class="text-gray-600 mr-4">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.616a1 1 0 01.894-1.79l1.599.8L9 4.323V3a1 1 0 011-1zm-5 8.274l-.818 2.552c.25.112.526.174.818.174.292 0 .569-.062.818-.174L5 10.274zm10 0l-.818 2.552c.25.112.526.174.818.174.292 0 .569-.062.818-.174L15 10.274z" clip-rule="evenodd"/>
                </svg>
            </button>
            <div class="w-48 h-1 bg-gray-200 rounded-full overflow-hidden">
                <div class="w-1/3 h-full bg-blue-600"></div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
